[package]
name = "ak820"
version = "0.1.1"
edition = "2021"
description = "Cross-platform (Linux/Windows) configuration tool for the AJAZZ AK820 Pro keyboard: lighting, per-key colors, key remapping, macros, TFT screen and clock"
license = "MIT"
readme = "README.md"
build = "build.rs"

[lib]
name = "ak820"
path = "src/lib.rs"

[[bin]]
name = "ak820"
path = "src/main.rs"

[[bin]]
name = "ak820-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:ksni", "dep:winit", "dep:tray-icon", "dep:windows-sys"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
eframe = { version = "=0.31.1", optional = true }
rfd = { version = "=0.15.3", optional = true }
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.1", features = ["blocking"], optional = true }
# Same winit as eframe; only used to pick the X11 backend (file drag & drop).
winit = { version = "0.30", default-features = false, features = ["x11"], optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.21.0", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
