[package]
name = "ak820"
version = "0.5.0"
edition = "2021"
# Floor set by the dependencies in Cargo.lock.
rust-version = "1.89"
description = "Cross-platform (Linux/Windows) configuration tool for the AJAZZ AK820 Pro and AK820 keyboards: lighting, per-key colors, key remapping, macros, TFT screen and clock"
license = "MIT"
readme = "README.md"
build = "build.rs"

[lib]
name = "ak820"
path = "src/lib.rs"

[[bin]]
name = "ak820"
path = "src/main.rs"

[[bin]]
name = "ak820-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = [
    "dep:eframe",
    "dep:rfd",
    "dep:ksni",
    "dep:smithay-client-toolkit",
    "dep:wayland-backend",
    "dep:raw-window-handle",
    "dep:ashpd",
    "dep:pollster",
    "dep:tray-icon",
    "dep:windows-sys",
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
eframe = { version = "=0.31.1", optional = true }
rfd = { version = "=0.15.3", optional = true }
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.1", features = ["blocking"], optional = true }
# System light/dark preference through the XDG settings portal (rfd already pulls both in).
ashpd = { version = "0.11", default-features = false, features = ["async-std"], optional = true }
pollster = { version = "0.4", optional = true }
# File drag & drop on native Wayland, which winit lacks (the versions egui already uses for
# the clipboard).
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"], optional = true }
wayland-backend = { version = "0.3", features = ["client_system"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.21.0", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
